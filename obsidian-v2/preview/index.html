<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic OS V2 — Obsidian component preview</title><link rel="stylesheet" href="/styles.css"><style>
/* Match native Obsidian's button layout so shrinking/stacking regressions appear here. */
button { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; }
*{box-sizing:border-box}body{margin:0;background:#111116;color:#e4e4ec;font:14px system-ui;--text-normal:#e4e4ec;--text-muted:#9698a8;--background-primary:#17171e;--background-secondary:#20202a;--interactive-accent:#a0a6be;--background-modifier-border:#333540;--font-interface:system-ui;--font-text:system-ui;--font-monospace:monospace}button,select{font:inherit}button{cursor:pointer}select{background:#232530;color:#ddd;border:1px solid #454958;border-radius:5px;padding:6px}.preview-host{padding:13px 24px;background:#23232b;color:#b0b1c0;display:flex;justify-content:space-between;gap:12px;font-size:11px;position:sticky;top:0;z-index:100}.preview-host strong{color:#edeef3}.aos-v2-cc-root{min-height:100vh;padding:20px 30px}#notice{position:fixed;bottom:22px;left:24px;background:#2e3344;color:white;z-index:100;border-radius:8px;max-width:540px}#notice:not(:empty){padding:14px}dialog{width:min(860px,90vw);max-height:85vh;color:#e5e7f2;background:#1b1d27;border:1px solid #555b71;border-radius:12px;padding:24px}dialog::backdrop{background:#0009}#document-name{overflow-wrap:anywhere;font-size:13px}#document-body{white-space:pre-wrap;line-height:1.65;font:13px system-ui}#close-document{float:right;padding:8px 16px}@media(max-width:620px){.aos-v2-cc-root{padding:8px}.preview-host{padding:10px;font-size:10px}}
</style></head><body><header class="preview-host"><strong>Obsidian V2 · Component preview</strong><span>Native cockpit components · Connected vault · Live V2 worker</span></header><main id="cockpit" class="aos-v2-cc-root" data-cc-theme="terminal"></main><div id="notice" role="status"></div><dialog id="document"><button id="close-document">Close</button><h2 id="document-name"></h2><pre id="document-body"></pre></dialog><script type="module" src="/bundle.js"></script></body></html>
