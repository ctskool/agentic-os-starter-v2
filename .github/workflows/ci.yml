name: ci
on:
  push:
  workflow_dispatch:
  # Every Monday, with nothing changed here. The install below downloads today's versions of everything
  # a member's fresh install would get, so a dependency that breaks the starter (as PyAV 19 broke
  # speech-to-text for a month) shows up here within a week instead of in a member's report.
  # GitHub switches scheduled runs off after 60 days without activity in the repository. A push does not
  # switch them back on: re-enable the workflow on the Actions page (or with `gh workflow enable ci.yml`).
  schedule:
    - cron: '17 9 * * 1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: America/Chicago   # several routing tests pin calendar dates in this zone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice shortcut unit tests (no microphone or OS hooks)
        run: python obsidian-v2/tests/mac-hotkey.test.py
      - name: Speech service test dependencies
        run: python -m pip install --disable-pip-version-check fastapi httpx numpy soundfile
      - name: Speech service unit tests (mocked audio and models)
        run: python obsidian-v2/tests/speech-runtime.test.py
      - name: Bridge and plugin packages
        working-directory: obsidian-v2
        run: npm ci --no-audit --no-fund
      - name: HUD packages
        working-directory: jarvis-v2
        run: npm ci --no-audit --no-fund
      - name: Build the plugin
        working-directory: obsidian-v2
        run: npm run build
      # What `aos setup` does on a Mac: the terminal helper must be executable.
      - name: Terminal helper is executable
        shell: bash
        run: node -e "import('./obsidian-v2/scripts/aos/setup.mjs').then(m => console.log(m.fixPtyHelper('obsidian-v2')))"
      # macOS keeps its temp folder behind a link (/var -> /private/var); the storage checks refuse links by design.
      - name: Temp folder without links
        if: runner.os == 'macOS'
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Stand-in for the coding CLIs
        # Some routing tests only need "a provider is installed"; no CLI is ever run by them.
        shell: bash
        run: |
          echo "AOS_CODEX_BIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
          echo "AOS_CLAUDE_BIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Bridge tests
        working-directory: obsidian-v2
        run: node --test --test-concurrency=2 --test-timeout=90000 "tests/*.test.mjs"
      - name: HUD typecheck and tests
        working-directory: jarvis-v2
        run: |
          npm run typecheck
          npm test

  # The pinned voice packages must install from published builds and import on the oldest and newest
  # supported Python (the install job below runs the full speech round trip on 3.12). Package and import
  # compatibility only: no models are downloaded here. Intel Macs have no GitHub runner and stay unverified.
  voice-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned voice packages into a fresh environment
        run: |
          python -m venv voice-check
          if [ "$RUNNER_OS" = "Windows" ]; then PY=voice-check/Scripts/python.exe; else PY=voice-check/bin/python; fi
          "$PY" -m pip install --disable-pip-version-check --prefer-binary -r obsidian-v2/runner/speech-requirements.txt
          "$PY" -m pip freeze
          "$PY" -c "import kokoro_onnx, faster_whisper, onnxruntime, ctranslate2, soundfile, fastapi, uvicorn; print('voice packages import on', __import__('sys').version)"

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # First, a computer where ANOTHER program already runs a speech service (port 3108). Setup must
      # share it and download nothing, the doctor must prove speak -> listen through it, and stop must
      # leave it running. A clean runner never has such a service, so a stand-in plays that program.
      - name: Another program's speech service (stand-in on 3108)
        run: |
          node -e "require('child_process').spawn(process.execPath,['obsidian-v2/tests/fixtures/fake-speech.mjs','--port','3108'],{detached:true,stdio:'ignore'}).unref()"
          for attempt in $(seq 1 20); do curl -fs http://127.0.0.1:3108/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3108/health
      - name: Install beside it (voice is shared, nothing is downloaded)
        run: |
          mkdir -p ci-logs
          node aos.mjs setup --vault "$RUNNER_TEMP/vault" --voice yes --autostart no --ci | tee ci-logs/setup-shared.log
          grep -q "will be shared, so there is nothing to download" ci-logs/setup-shared.log
          test ! -e obsidian-v2/.runtime/speech-venv
      # Conversations inside Obsidian: the Terminal plugin runs its helper with this managed Python
      # (Windows needs psutil + pywinctl in it). Checked through the managed interpreter, not the runner's.
      - name: Terminal helper Python is prepared and recorded
        run: |
          node -e "import('./obsidian-v2/runner/terminal-python-record.mjs').then(m => { const p = m.recordedTerminalPython(require('path').resolve('obsidian-v2/.runtime')); console.log(p); if (!p) process.exit(1); })"
          if [ "$RUNNER_OS" = "Windows" ]; then obsidian-v2/.runtime/terminal-venv/Scripts/python.exe -c "import psutil, pywinctl"; else obsidian-v2/.runtime/terminal-venv/bin/python -c "import pty, selectors"; fi
      - name: A fresh vault gets a provider without asking
        run: node -e "const s=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/vault/system/v2/provider.json','utf8'));console.log(s);if(!['claude','codex'].includes(s.provider))process.exit(1)"
      - name: Doctor with the shared voice
        run: |
          node aos.mjs doctor --ci | tee ci-logs/doctor-shared.log
          grep -q "PASS Voice service healthy - .*shared service at http://127.0.0.1:3108" ci-logs/doctor-shared.log
          grep -q "PASS Text to speech" ci-logs/doctor-shared.log
          grep -q "PASS Speech to text hears it back" ci-logs/doctor-shared.log
      - name: The monitor runs no speech service of its own, and stop leaves the other program's alone
        run: |
          node aos.mjs status > ci-logs/status-shared.json
          node -e "const s=JSON.parse(require('fs').readFileSync('ci-logs/status-shared.json','utf8'));const ids=s.supervisor.services.map(x=>x.id);console.log(ids,s.bridge.speech.url);if(ids.includes('speech')||s.bridge.speech.url!=='http://127.0.0.1:3108')process.exit(1)"
          node aos.mjs stop | tee ci-logs/stop-shared.log
          if grep -q "Stopped speech" ci-logs/stop-shared.log; then echo "stop touched the shared speech service"; exit 1; fi
          curl -fs http://127.0.0.1:3108/health
      - name: The other program goes away
        run: |
          curl -fs -X POST http://127.0.0.1:3108/quit
          sleep 2
          if curl -fs http://127.0.0.1:3108/health; then echo "stand-in still running"; exit 1; fi
      # Now the ordinary case: nothing to share, so setup installs this installation's own voice.
      # (The upgrade job at the end of this file is the other ordinary case: a member who already has it.)
      - name: Install into a fresh vault, with voice
        run: |
          node aos.mjs setup --vault "$RUNNER_TEMP/vault" --provider claude --voice yes --autostart no --ci | tee ci-logs/setup-own.log
          test -e obsidian-v2/.runtime/speech-venv
          node -e "const s=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/vault/system/v2/provider.json','utf8'));console.log(s);if(s.provider!=='claude'||s.model!=='opus')process.exit(1)"
      - name: Doctor
        run: |
          node aos.mjs doctor --ci | tee ci-logs/doctor-own.log
          grep -q "PASS Voice service healthy - .*this installation's own service on 3220" ci-logs/doctor-own.log
          grep -q "PASS Speech to text hears it back" ci-logs/doctor-own.log
      # A vault that asks for another language: setup fetches that language's speech model, voice starts
      # in it, and the doctor speaks and listens in it. English words heard back would fail this.
      - name: Voice in another language (Portuguese)
        run: |
          node aos.mjs stop
          node -e "const fs=require('fs'),f=process.env.RUNNER_TEMP+'/vault/system/v2/profile.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.speechLanguage='pt';fs.writeFileSync(f,JSON.stringify(p,null,1))"
          node aos.mjs setup --vault "$RUNNER_TEMP/vault" --voice yes --autostart no --ci | tee ci-logs/setup-language.log
          node aos.mjs doctor --ci | tee ci-logs/doctor-language.log
          grep -q "PASS Voice service healthy - .*hearing and speaking Portuguese (Brazil)" ci-logs/doctor-language.log
          grep -q "PASS Speech to text hears it back" ci-logs/doctor-language.log
      - name: Status
        if: always()
        run: node aos.mjs status || true
      - name: Stop
        run: node aos.mjs stop
      - name: Logs
        if: failure()
        run: |
          cat obsidian-v2/.runtime/service-supervisor.jsonl || true
          ls -la obsidian-v2/.runtime || true

  # A member who installed 0.3.64 and now runs `node aos.mjs update`. This job is that member on a
  # clean computer: it clones the public repository the way their agent did, installs 0.3.64 with
  # voice, uses it a little (a note, Daily Drivers, chosen dashboard buttons), then updates to the
  # commit under test with 0.3.64's OWN update command. Afterwards the doctor must pass on the new
  # version, what the member had must still be there, and the checkout must still count as a stock
  # starter so the next update is allowed.
  # Two steps differ from a member's machine, both because the commit under test is not on main yet:
  # the download takes that commit instead of pulling main, and the re-run of setup gets --ci (no
  # coding CLI is signed in on a runner). See obsidian-v2/tests/fixtures/ci-upgrade.cjs.
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OLD_SHA: 6bfc2195e7cc70b728dd68de387c350a940c2337   # 0.3.64, the release members installed
      NEW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the public repository and stand where that member stands (main at 0.3.64)
        run: |
          git clone https://github.com/ctskool/agentic-os-starter-v2 "$RUNNER_TEMP/agentic-os"
          cd "$RUNNER_TEMP/agentic-os"
          git cat-file -e "$NEW_SHA^{commit}" 2>/dev/null || git fetch origin "$NEW_SHA"
          git merge-base --is-ancestor "$OLD_SHA" "$NEW_SHA"
          git show "$NEW_SHA:obsidian-v2/tests/fixtures/ci-upgrade.cjs" > "$RUNNER_TEMP/ci-upgrade.cjs"
          git show "$NEW_SHA:obsidian-v2/tests/fixtures/ci-upgrade-check.cjs" > "$RUNNER_TEMP/ci-upgrade-check.cjs"
          git checkout -q main
          git reset -q --hard "$OLD_SHA"
          git update-ref refs/remotes/origin/main "$OLD_SHA"
          git status -sb
          test "$(node -p "require('./VERSION.json').plugin")" = "0.3.64"
          echo "VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
      # 0.3.64's own doctor may fail its voice round trip today (a later PyAV broke speech-to-text, fixed
      # since by a pin), so its verdict is recorded, not required. The update below has to repair it.
      - name: Install 0.3.64 with voice
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          node aos.mjs setup --vault "$VAULT" --provider claude --voice yes --autostart no --ci 2>&1 | tee "$RUNNER_TEMP/old-setup.log" || echo "::warning::0.3.64 setup reported a problem; see its doctor lines"
          test "$(node -p "require(process.env.VAULT + '/.obsidian/plugins/agentic-os-v2/manifest.json').version")" = "0.3.64"
          test -e obsidian-v2/.runtime/speech-venv
          node aos.mjs status || true
      - name: Use it like a member (a note, Daily Drivers, chosen buttons)
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          node "$RUNNER_TEMP/ci-upgrade-check.cjs" before
      - name: Update with 0.3.64's own update command
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          node "$RUNNER_TEMP/ci-upgrade.cjs" 2>&1 | tee "$RUNNER_TEMP/update.log"
          test "$(git rev-parse HEAD)" = "$NEW_SHA"
      - name: Doctor on the updated installation
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          node aos.mjs doctor --ci | tee "$RUNNER_TEMP/doctor-new.log"
          grep -q "PASS Bridge answering" "$RUNNER_TEMP/doctor-new.log"
          grep -q "PASS Jarvis HUD answering" "$RUNNER_TEMP/doctor-new.log"
          grep -q "PASS Voice service healthy - .*this installation's own service on 3220" "$RUNNER_TEMP/doctor-new.log"
          grep -q "PASS Speech to text hears it back" "$RUNNER_TEMP/doctor-new.log"
          grep -q "SKIP Live voice (OpenAI key) - not set up" "$RUNNER_TEMP/doctor-new.log"
      - name: What the member had is still there
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          node obsidian-v2/tests/fixtures/ci-upgrade-check.cjs after
      - name: The checkout still counts as a stock starter, so the next update is allowed
        run: |
          cd "$RUNNER_TEMP/agentic-os"
          git status -sb
          node -e "import('./obsidian-v2/scripts/aos/upgrade-checkout.mjs').then(m => { const a = m.assessCheckout(require('path').resolve('obsidian-v2')); console.log(a.kind, a.issues, a.changes); if (a.updateAllowed !== true) process.exit(1); })"
      - name: Status
        if: always()
        run: cd "$RUNNER_TEMP/agentic-os" && node aos.mjs status || true
      - name: Stop
        run: cd "$RUNNER_TEMP/agentic-os" && node aos.mjs stop
      - name: Logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/agentic-os/obsidian-v2/.runtime/service-supervisor.jsonl" || true
          ls -la "$RUNNER_TEMP/agentic-os/obsidian-v2/.runtime" || true
